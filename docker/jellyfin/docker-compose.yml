---
services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    user: 1000:1000
    group_add:
      - "993"
    ports:
      - 8096:8096
    volumes:
      - /srv/jellyfin/config:/config
      - /srv/jellyfin/cache:/cache
      - /media:/media
    devices:
      - /dev/dri:/dev/dri
    restart: 'unless-stopped'
    environment:
      - TZ=Europe/London